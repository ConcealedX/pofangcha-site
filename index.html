<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>破防茶.Z · 个人网站（设计稿预览）</title>
  <meta name="description" content="破防茶.Z 的个人网站设计稿预览：首页、关于我、我的文章、我的作品四个页面。">
  <meta name="theme-color" content="#070b12">
  <meta property="og:type" content="website">
  <meta property="og:title" content="破防茶.Z · 个人网站">
  <meta property="og:description" content="能源工程师 · 个人体系构建者 · 长期主义实践者。记录学习、实践与复盘。">
  <style>
    :root { color-scheme: dark; --bg:#070b12; --panel:#0a101b; --text:#e6edf7; --muted:#8c9bad; --cyan:#52e5d4; --line:#1b2a3a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 28px; background:rgba(10,16,27,.96); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
    .brand { font:700 15px/1.4 Consolas,monospace; letter-spacing:.06em; color:var(--cyan); white-space:nowrap; }
    .note { margin-top:4px; color:var(--muted); font-size:12px; }
    nav { display:flex; flex-wrap:wrap; gap:10px; }
    button { appearance:none; border:1px solid var(--line); border-radius:7px; padding:10px 16px; background:#0d1623; color:#a7b5c5; font:14px/1 "Microsoft YaHei",sans-serif; cursor:pointer; }
    button:hover { border-color:var(--cyan); color:var(--cyan); }
    button.active { border-color:var(--cyan); background:var(--cyan); color:#07110f; font-weight:700; }
    main { max-width:1440px; margin:0 auto; padding:32px 24px 64px; }
    .meta { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; line-height:1.4; }
    .hint { margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.7; }
    .open-link { color:var(--cyan); font-size:13px; text-decoration:none; white-space:nowrap; }
    .open-link:hover { text-decoration:underline; }
    .page { display:none; margin:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#070b12; box-shadow:0 24px 80px rgba(0,0,0,.28); }
    .page.active { display:block; }
    .page img { display:block; width:100%; height:auto; }
    footer { margin-top:20px; color:#5d6c7d; font:12px/1.7 Consolas,"Microsoft YaHei",monospace; }
    @media (max-width:800px) {
      header { position:relative; align-items:flex-start; flex-direction:column; padding:18px; }
      main { padding:20px 12px 40px; }
      .meta { align-items:flex-start; flex-direction:column; }
      h1 { font-size:21px; }
      button { padding:9px 13px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">破防茶.Z / DESIGN PREVIEW</div>
      <div class="note">四个页面的静态视觉稿 · 无需登录 · 已含赛博朋克城市视觉带</div>
    </div>
    <nav aria-label="设计稿页面切换">
      <button class="active" data-page="home">首页</button>
      <button data-page="about">关于我</button>
      <button data-page="articles">我的文章</button>
      <button data-page="works">我的作品</button>
    </nav>
  </header>
  <main>
    <div class="meta">
      <div>
        <h1 id="page-title">首页｜设计稿预览</h1>
        <p class="hint">这是长图式静态预览，用于检查视觉效果；页面内的导航、文章阅读和作品筛选尚未实现。</p>
      </div>
      <a class="open-link" id="open-image" href="home.png" target="_blank" rel="noopener">单独打开原图</a>
    </div>
    <figure class="page active" id="home"><img src="home.png" alt="个人网站首页完整设计稿"></figure>
    <figure class="page" id="about"><img src="about.png" alt="个人网站关于我页面完整设计稿" loading="lazy"></figure>
    <figure class="page" id="articles"><img src="articles.png" alt="个人网站我的文章页面完整设计稿" loading="lazy"></figure>
    <figure class="page" id="works"><img src="works.png" alt="个人网站我的作品页面完整设计稿" loading="lazy"></figure>
    <footer>© 2026 破防茶.Z · DESIGN PREVIEW / STATIC EXPORT</footer>
  </main>
  <script>
    const names = { home:"首页", about:"关于我", articles:"我的文章", works:"我的作品" };
    const buttons = [...document.querySelectorAll("button[data-page]")];
    function showPage(id) {
      if (!names[id]) id = "home";
      document.querySelectorAll(".page").forEach(page => page.classList.toggle("active", page.id === id));
      buttons.forEach(button => button.classList.toggle("active", button.dataset.page === id));
      document.getElementById("page-title").textContent = names[id] + "｜设计稿预览";
      document.getElementById("open-image").href = id + ".png";
      history.replaceState(null, "", "#" + id);
      window.scrollTo({ top:0, behavior:"instant" });
    }
    buttons.forEach(button => button.addEventListener("click", () => showPage(button.dataset.page)));
    showPage(location.hash.slice(1) || "home");
  </script>
</body>
</html>
